<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <title>Réception - La Lunetterie</title>
    <meta name="theme-color" content="#2563eb" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="scan.css" />
    <style>
        .reception-main { max-width: 960px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .station-picker { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .station-picker label { font-weight: 600; font-size: 14px; }
        .station-picker select { padding: 9px 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px; }
        .transfer-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
        .transfer-card-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--line-soft); flex-wrap: wrap; gap: 8px; }
        .transfer-card-head h3 { margin: 0; font-size: 15px; }
        .transfer-card-head .sub { font-size: 12px; color: var(--ink-soft); }
        .transfer-status { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: var(--radius-full); background: var(--primary); color: #fff; }
        .reception-empty { text-align: center; padding: 48px 16px; color: var(--ink-soft); }
    </style>
</head>
<body>
    <div class="desktop-shell" id="desktopShell">
        <header class="app-header">
            <div class="logo">
                <div class="logo-icon"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11.4L12 4l8 7.4V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8.6z"/></svg></div>
                <div>Réception <span class="version">v1.0</span></div>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" id="refreshBtn">
                    <svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
                    <span>Actualiser</span>
                </button>
                <button class="btn btn-outline" onclick="window.location.href='scan.html'">
                    <svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                    <span>Retour</span>
                </button>
            </div>
        </header>

        <main class="reception-main">
            <div class="station-picker">
                <label for="stationSelect">Station de réception</label>
                <select id="stationSelect"></select>
            </div>

            <div id="transfersList"></div>
        </main>
    </div>

    <script src="reception.js"></script>
</body>
</html>
