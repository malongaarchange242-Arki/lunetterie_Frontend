<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Historique des mouvements - La Lunetterie</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="admin.css" />
    <link rel="stylesheet" href="mobile-shell.css" />
    <link rel="stylesheet" href="admin-mobile.css" />
    <link rel="stylesheet" href="historique.css" />
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
        <symbol id="ic-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3.5 2"/></symbol>
        <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></symbol>
        <symbol id="ic-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
        <symbol id="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></symbol>
        <symbol id="ic-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
        <symbol id="ic-chevron-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
        <symbol id="ic-chevron-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    </defs></svg>

    <main class="main-content">
        <header class="topbar">
            <div class="page-title">
                <h2><svg class="i" style="vertical-align:-3px;margin-right:6px;"><use href="#ic-history"/></svg>Historique des mouvements</h2>
                <p>Traçabilité complète des montures : réceptions, transferts, présentoir, ventes, réserves...</p>
            </div>
            <div class="topbar-actions">
                <button class="action-btn" id="themeToggle" title="Changer de thème">
                    <svg class="i" id="themeIcon"><use href="#ic-sun"/></svg>
                </button>
                <button class="btn btn-outline" id="refreshBtn" type="button">
                    <svg class="i"><use href="#ic-refresh"/></svg><span>Actualiser</span>
                </button>
                <button class="btn btn-outline" type="button" onclick="window.location.href='admin.html'">
                    <svg class="i"><use href="#ic-arrow-left"/></svg><span>Retour</span>
                </button>
            </div>
        </header>

        <div class="page-content">
            <div class="table-container">
                <div class="table-toolbar">
                    <div class="filter-group">
                        <select id="filterFromStation" title="Poste de départ"><option value="">De · tous postes</option></select>
                        <select id="filterToStation" title="Poste d'arrivée"><option value="">Vers · tous postes</option></select>
                        <select id="filterAction"><option value="">Toutes les actions</option></select>
                        <select id="filterUser"><option value="">Tous les utilisateurs</option></select>
                        <input type="text" id="filterBarcode" placeholder="🔍 Code-barres..." />
                        <input type="date" id="filterDateFrom" title="Depuis le" />
                        <input type="date" id="filterDateTo" title="Jusqu'au" />
                        <button class="btn btn-outline" id="resetFiltersBtn" type="button">Réinitialiser</button>
                    </div>
                    <span id="movementCount" style="font-size:14px;color:var(--ink-soft);">0 mouvement</span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Monture</th>
                                <th>Action</th>
                                <th>De</th>
                                <th>Vers</th>
                                <th>Utilisateur</th>
                            </tr>
                        </thead>
                        <tbody id="movementsTable"><tr><td colspan="6" style="text-align:center;padding:30px;color:var(--muted);">Chargement…</td></tr></tbody>
                    </table>
                </div>
                <div class="table-toolbar" style="border-top:1px solid var(--line);">
                    <button class="btn btn-outline" id="prevPageBtn" type="button"><svg class="i"><use href="#ic-chevron-left"/></svg> Précédent</button>
                    <span id="pageInfo" style="font-size:13px;color:var(--ink-soft);">Page 1</span>
                    <button class="btn btn-outline" id="nextPageBtn" type="button">Suivant <svg class="i"><use href="#ic-chevron-right"/></svg></button>
                </div>
            </div>
        </div>
    </main>

    <script src="historique.js"></script>
</body>
</html>
