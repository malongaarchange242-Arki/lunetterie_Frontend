<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - La Lunetterie</title>
    <!-- Font Awesome 6 Pro (simulé avec Free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- CSS de la page de connexion -->
    <link rel="stylesheet" href="login.css" />
</head>
<body>

    <!-- ARRIÈRE-PLAN AVEC FLOU (logo.jpeg) -->
    <div class="bg-wrapper">
        <div class="bg-image" id="bgImage"></div>
        <div class="bg-overlay"></div>
    </div>
    

    <!-- CONTENEUR PRINCIPAL (Perspective 3D) -->
    <div class="login-container">
        <div class="login-card" id="loginCard">
            <!-- LOGO -->
            <img src="logo.jpeg" alt="La Lunetterie" class="login-logo" />
            
            <h2>Connexion</h2>
            <p class="subtitle">Connectez-vous par e-mail ou par authentification biométrique</p>

            <!-- CONNEXION PAR E-MAIL : le mot de passe apparaît dès que
                 l'adresse est reconnue, sans étape ou bouton intermédiaire. -->
            <form class="email-login-form" id="emailLoginForm" novalidate>
                <label class="field-label" for="loginEmail">Adresse e-mail</label>
                <div class="input-wrap">
                    <i class="fas fa-envelope" aria-hidden="true"></i>
                    <input id="loginEmail" name="email" type="email" inputmode="email" autocomplete="email" placeholder="vous@lunetterie.com" required />
                </div>
                <p class="email-feedback" id="emailFeedback" aria-live="polite"></p>

                <div class="password-step" id="passwordStep" hidden>
                    <label class="field-label" for="loginPassword" id="loginPasswordLabel">Mot de passe</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Saisissez votre mot de passe" required />
                    </div>

                    <div class="input-wrap" id="confirmPasswordWrap" hidden>
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Confirmez votre mot de passe" />
                    </div>

                    <button class="email-login-btn" id="emailLoginBtn" type="submit">
                        <i class="fas fa-right-to-bracket" aria-hidden="true"></i>
                        <span id="emailLoginBtnText">Se connecter</span>
                    </button>
                </div>
            </form>

            <div class="login-separator" aria-hidden="true"><span>ou</span></div>

            <!-- ZONE DE SCAN -->
            <div class="scanner-wrapper">
                <div class="scanner-box" id="scannerBox">
                    <i class="fas fa-fingerprint scanner-icon" id="scannerIcon"></i>
                    <div class="scanner-line" id="scannerLine"></div>
                </div>
            </div>

            <!-- MESSAGES DE STATUT -->
            <div class="status-message" id="statusMessage">
                Utilisez votre empreinte digitale pour vous connecter.
            </div>
            
            <p class="help-text">
                <i class="fas fa-info-circle"></i> Placez votre doigt sur le lecteur connecté pour accéder au système.
            </p>
        </div>
    </div>

    
    <script src="login.js"></script>
</body>
</html>
